# ==============================================================================
# Franchise Dashboard - Nginx Initial Bootstrap Configuration (HTTP Only)
# 배포 위치: /etc/nginx/sites-available/franchise-dashboard-bootstrap.conf
# 목적: Let's Encrypt TLS 인증서 발급 전 포트 80 ACME 챌린지 통과용 초기 템플릿
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com; # 운영 도메인으로 변경

    # Let's Encrypt ACME 챌린지 경로 (Certbot Webroot 인증 경로)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API 헬스체크 임시 프록시 (인증서 발급 전 서비스 상태 확인용)
    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }

    # 초기 부트스트랩 상태 안내 응답
    location / {
        return 200 "Franchise Dashboard - HTTP bootstrap in progress. Awaiting TLS certificate issuance.\n";
        add_header Content-Type text/plain;
    }
}
