# ==============================================================================
# Franchise Dashboard - Nginx Reverse Proxy & Static Hosting Configuration
# 배포 위치: /etc/nginx/sites-available/franchise-dashboard.conf
#
# [중요: 신규 서버 초기 TLS 인증서 발급 및 부트스트랩 순서]
# 1. 신규 서버 구축 초기에는 /etc/letsencrypt/live/... 경로에 인증서가 존재하지 않으므로,
#    본 HTTPS 설정을 처음부터 그대로 적용하면 'cannot load certificate'로 nginx -t가 실패합니다.
# 2. 신규 서버 단계별 프로비저닝 순서:
#    Step 1 (HTTP 부트스트랩): deploy/nginx-bootstrap.conf 활성화 (포트 80 및 ACME 챌린지 오픈)
#           sudo cp /opt/franchise-dashboard/deploy/nginx-bootstrap.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/nginx-bootstrap.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#    Step 2 (Certbot 발급 및 갱신 훅 등록):
#           sudo mkdir -p /var/www/certbot
#           sudo certbot certonly --webroot -w /var/www/certbot -d dashboard.example.com --deploy-hook "systemctl reload nginx"
#           (certbot.timer 갱신 시 Nginx가 새 인증서를 메모리에 자동 리로드하도록 훅 등록 필수)
#    Step 3 (HTTPS 전환):
#           인증서 파일 생성 확인 후 본 파일(franchise-dashboard.conf)을 sites-enabled에 링크하고 리로드:
#           sudo ln -sf /etc/nginx/sites-available/franchise-dashboard.conf /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/nginx-bootstrap.conf
#           sudo nginx -t && sudo systemctl reload nginx
#
# ※ Caddy(deploy/Caddyfile)를 사용할 경우, Caddy 내장 ACME가 도메인 지정 시 Let's Encrypt 인증서를
#   전자동으로 발급/적용하므로 위 2단계 부트스트랩 과정 없이 즉시 HTTPS 가동이 가능합니다.
# ==============================================================================

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com; # 운영 도메인으로 변경

    # Let's Encrypt ACME 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 메인 서버 블록
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.example.com; # 운영 도메인으로 변경

    # SSL 인증서 경로 (Let's Encrypt certbot 표준)
    ssl_certificate /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 공통 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 정적 프론트엔드 배포 경로
    root /opt/franchise-dashboard/frontend/dist;
    index index.html;

    # 정적 빌드 자산 장기 캐싱 (/assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Nginx add_header 상속 규칙 대응: location 내 보안 헤더 명시
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # API 리버스 프록시 (/api/ 경로 전체)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 버퍼링 최적화
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Swagger / Redoc 문서 프록시 (필요 시 접근 제어 적용 가능)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 외부 모니터링용 헬스체크 경로 매핑
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # SPA (Single Page Application) 클라이언트 라우팅 fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        # Nginx add_header 상속 규칙 대응: HTML 응답 보안 헤더 명시
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 로그 설정
    access_log /var/log/nginx/franchise-dashboard.access.log combined;
    error_log /var/log/nginx/franchise-dashboard.error.log warn;
}
